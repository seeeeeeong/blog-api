spring:
  application:
    name: blog-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
        upstream:
          include: ping,db
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

blog:
  slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:700}

blog-ai:
  base-url: ${BLOG_AI_BASE_URL:http://localhost:8081}
  internal-key: ${BLOG_AI_INTERNAL_KEY:dev-internal-key}
  connect-timeout-ms: ${BLOG_AI_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${BLOG_AI_READ_TIMEOUT_MS:5000}
  backfill-read-timeout-ms: ${BLOG_AI_BACKFILL_READ_TIMEOUT_MS:300000}
  web-base-url: ${BLOG_WEB_BASE_URL:http://localhost:5173}
  relay:
    interval-ms: ${BLOG_AI_RELAY_INTERVAL_MS:5000}

view-count:
  ttl-seconds: 3600

image-upload:
  presigned:
    ttl-seconds: 180
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-folders:
      - blog
      - profile

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blog_db?currentSchema=public
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:blog-images-local}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}
    default-folder: blog

logging:
  config: classpath:logback-dev.xml

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=prefer&currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN}
    default-folder: blog

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  release: ${APP_VERSION:unknown}
  send-default-pii: false
  traces-sample-rate: 0.0
  in-app-includes:
    - com.blog.api
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

logging:
  config: classpath:logback-prod.xml
