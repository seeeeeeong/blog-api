spring:
  application:
    name: blog-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
        upstream:
          include: ping,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

blog:
  slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:700}

view-count:
  ttl-seconds: 3600

image-upload:
  presigned:
    ttl-seconds: 180
    one-time-token-ttl-seconds: 300
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-folders:
      - blog
      - profile

login-rate-limit:
  window-seconds: 600
  max-failures: 10

post-ranking:
  local-fallback-ttl-seconds: 60
  local-fallback-max-size: 50
  reseed-min-size: 100

resilience4j:
  circuitbreaker:
    instances:
      post-ranking-redis:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blog_db?currentSchema=public
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      timeout: 250ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 100ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-url: ${OAUTH_REDIRECT_URL:http://localhost:5173/auth/callback}
    callback-url: ${OAUTH_CALLBACK_URL:http://localhost:8080/api/auth/github/callback}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:blog-images-local}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}
    default-folder: blog

refresh-token:
  expiration-seconds: 1209600  # 14 days

logging:
  config: classpath:logback-dev.xml

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=prefer&currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 4
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 250ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 100ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-url: ${OAUTH_REDIRECT_URL}
    callback-url: ${OAUTH_CALLBACK_URL}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN}
    default-folder: blog

refresh-token:
  expiration-seconds: 1209600  # 14 days

logging:
  config: classpath:logback-prod.xml
