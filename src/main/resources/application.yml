spring:
  application:
    name: blog-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
        upstream:
          include: ping,db

blog:
  slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:700}

view-count:
  ttl-seconds: 3600

image-upload:
  presigned:
    ttl-seconds: 180
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-folders:
      - blog
      - profile

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blog_db?currentSchema=public
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:blog-images-local}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}
    default-folder: blog

logging:
  config: classpath:logback-dev.xml

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=prefer&currentSchema=public
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 4
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    web:
      pageable:
        max-page-size: 100

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN}
    default-folder: blog

logging:
  config: classpath:logback-prod.xml
