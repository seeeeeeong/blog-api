spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blog-api-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key-for-blog-api-context
  access-expiration: 3600000
  refresh-expiration: 1209600000

aws:
  s3:
    bucket: blog-images-test
    region: ap-northeast-2
    cloudfront-domain: ""
    default-folder: blog

cors:
  allowed-origins: http://localhost:5173

blog-ai:
  base-url: http://localhost:8081
  internal-key: test-internal-key
  web-base-url: http://localhost:5173
