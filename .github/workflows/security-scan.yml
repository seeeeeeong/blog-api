name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # SARIF 업로드 (선택)

jobs:
  trivy:
    name: Trivy - Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.56.1/trivy_0.56.1_Linux-64bit.tar.gz
          tar xzf trivy_0.56.1_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Build Docker image for scanning
        run: docker build -t blog-api:scan .

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --exit-code 0 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --format table \
            blog-api:scan

  tfsec:
    name: tfsec - Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: false
