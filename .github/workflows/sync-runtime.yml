name: Sync Runtime Files to EC2

on:
  push:
    branches: [main]
    paths:
      - 'infra/runtime/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Sync runtime files via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG || 'blog-server' }}
        run: |
          set -euo pipefail

          # Pack runtime files
          ARCHIVE_B64=$(tar czf - -C infra/runtime . | base64 | tr -d '\n')

          INSTANCE_ID="${EC2_INSTANCE_ID:-}"
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=$EC2_NAME_TAG" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          PARAMS_FILE=$(mktemp)
          trap 'rm -f "$PARAMS_FILE"' EXIT
          jq -n --arg archive "$ARCHIVE_B64" '{
            commands: [
              ("echo " + ($archive | @sh) + " | base64 -d | tar xzf - -C /opt/services"),
              "bash /opt/services/post-sync.sh"
            ]
          }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StatusDetails' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) echo "Runtime sync completed."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "----- stdout -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                echo "----- stderr -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Sync timed out."
          exit 1
