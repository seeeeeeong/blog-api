name: Sync Runtime Files to EC2

on:
  push:
    branches: [main]
    paths:
      - 'infra/runtime/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Sync runtime files via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG || 'blog-server' }}
        run: |
          set -euo pipefail

          # Pack runtime files
          ARCHIVE_B64=$(tar czf - -C infra/runtime . | base64 | tr -d '\n')

          INSTANCE_ID="${EC2_INSTANCE_ID:-}"
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=$EC2_NAME_TAG" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          PARAMS_FILE=$(mktemp)
          trap 'rm -f "$PARAMS_FILE"' EXIT
          jq -n --arg archive "$ARCHIVE_B64" '{
            commands: [
              "set -euo pipefail",

              "# Unpack runtime files",
              "mkdir -p /opt/services/bin /opt/services/env /opt/services/data/{redis,devlog-postgres,caddy,backups/postgres} /opt/services/config/caddy /opt/services/scripts/backup /opt/services/scripts/monitoring",
              "echo \"" + $archive + "\" | base64 -d | tar xzf - -C /opt/services",
              "mv -f /opt/services/deploy-service.sh /opt/services/bin/deploy-service.sh",
              "chmod +x /opt/services/bin/deploy-service.sh /opt/services/scripts/backup/*.sh /opt/services/scripts/monitoring/*.sh",

              "# Install/update cron jobs for backup, restore rehearsal, restart metrics",
              "CRON_TMP=$(mktemp) && (crontab -l 2>/dev/null || true) | grep -v pg_backup_to_s3.sh | grep -v pg_restore_rehearsal.sh | grep -v publish_container_restart_metric.sh > \"$CRON_TMP\" || true && { cat \"$CRON_TMP\"; echo \"15 3 * * * /opt/services/scripts/backup/pg_backup_to_s3.sh >> /var/log/blog-pg-backup.log 2>&1\"; echo \"30 4 * * 0 /opt/services/scripts/backup/pg_restore_rehearsal.sh >> /var/log/blog-pg-restore-rehearsal.log 2>&1\"; echo \"*/5 * * * * /opt/services/scripts/monitoring/publish_container_restart_metric.sh >> /var/log/blog-container-restart-metric.log 2>&1\"; } | crontab - && rm -f \"$CRON_TMP\"",

              "# Ensure placeholder env files exist (prevents compose failure before first deploy)",
              "for f in /opt/services/env/blog-api.env /opt/services/env/devlog-archive.env /opt/services/env/devlog-db.env; do [ -f \"$f\" ] || touch \"$f\"; done",

              "# Detect compose command (EC2 bootstrap installs standalone docker-compose)",
              "if docker compose version >/dev/null 2>&1; then COMPOSE_CMD='docker compose'; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE_CMD='docker-compose'; else echo 'No compose command found'; exit 1; fi",

              "# Reload Caddy if running (pick up Caddyfile changes)",
              "if docker inspect blog-caddy >/dev/null 2>&1; then docker exec blog-caddy caddy reload --config /etc/caddy/Caddyfile; fi",

              "# Reconcile shared services only (app services are managed by deploy-service.sh)",
              "if [ -f /opt/services/compose.env ]; then $COMPOSE_CMD --env-file /opt/services/compose.env -f /opt/services/docker-compose.yml up -d caddy redis redis-exporter node-exporter; fi",

              "echo \"Runtime sync completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            ]
          }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StatusDetails' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) echo "Runtime sync completed."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "----- stdout -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                echo "----- stderr -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Sync timed out."
          exit 1
