name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build -t "$ECR_REGISTRY/blog-api:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/blog-api:$IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        env:
          ECR_IMAGE: ${{ secrets.ECR_REGISTRY }}/blog-api:${{ needs.build.outputs.image_tag }}
          EC2_INSTANCE_ID_SECRET: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_NAME_TAG: ${{ vars.EC2_NAME_TAG }}
        run: |
          set -euo pipefail

          resolve_state_by_id() {
            local instance_id="$1"
            aws ec2 describe-instances \
              --instance-ids "$instance_id" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null || true
          }

          find_running_instance_by_tag() {
            local tag_name="$1"
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$tag_name" "Name=instance-state-name,Values=running" \
              --query 'sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId' \
              --output text
          }

          find_running_instance_by_wildcard_tag() {
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=*server*" "Name=instance-state-name,Values=running" \
              --query 'sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId' \
              --output text
          }

          find_any_running_instance() {
            aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" \
              --query 'sort_by(Reservations[].Instances[], &LaunchTime)[-1].InstanceId' \
              --output text
          }

          INSTANCE_ID="${EC2_INSTANCE_ID_SECRET:-}"
          INSTANCE_TAG_NAME="${EC2_NAME_TAG:-blog-server}"
          INSTANCE_STATE=""

          if [ -n "$INSTANCE_ID" ]; then
            INSTANCE_STATE=$(resolve_state_by_id "$INSTANCE_ID")
            echo "EC2_INSTANCE_ID secret state: ${INSTANCE_STATE:-unknown}"
          fi

          if [ "$INSTANCE_STATE" = "stopped" ] || [ "$INSTANCE_STATE" = "stopping" ]; then
            echo "Starting stopped EC2 instance: $INSTANCE_ID"
            if aws ec2 start-instances --instance-ids "$INSTANCE_ID" --output text >/dev/null 2>&1; then
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              INSTANCE_STATE="running"
            else
              echo "::warning::Failed to start EC2 instance via workflow role. Trying running-instance fallback."
            fi
          fi

          if [ -z "$INSTANCE_ID" ] || [ -z "$INSTANCE_STATE" ] || [ "$INSTANCE_STATE" = "None" ] || [ "$INSTANCE_STATE" = "terminated" ] || [ "$INSTANCE_STATE" = "shutting-down" ]; then
            CANDIDATE_ID=$(find_running_instance_by_tag "$INSTANCE_TAG_NAME")
            if [ -n "$CANDIDATE_ID" ] && [ "$CANDIDATE_ID" != "None" ]; then
              echo "Using running EC2 instance by tag [$INSTANCE_TAG_NAME]: $CANDIDATE_ID"
              INSTANCE_ID="$CANDIDATE_ID"
              INSTANCE_STATE="running"
            fi
          fi

          if [ "$INSTANCE_STATE" != "running" ]; then
            CANDIDATE_ID=$(find_running_instance_by_wildcard_tag)
            if [ -n "$CANDIDATE_ID" ] && [ "$CANDIDATE_ID" != "None" ]; then
              echo "Using running EC2 instance by wildcard tag (*server*): $CANDIDATE_ID"
              INSTANCE_ID="$CANDIDATE_ID"
              INSTANCE_STATE="running"
            fi
          fi

          if [ "$INSTANCE_STATE" != "running" ]; then
            CANDIDATE_ID=$(find_any_running_instance)
            if [ -n "$CANDIDATE_ID" ] && [ "$CANDIDATE_ID" != "None" ]; then
              echo "::warning::Using latest running EC2 instance without tag match: $CANDIDATE_ID"
              INSTANCE_ID="$CANDIDATE_ID"
              INSTANCE_STATE="running"
            fi
          fi

          if [ "$INSTANCE_STATE" = "pending" ]; then
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            INSTANCE_STATE="running"
          fi

          if [ "$INSTANCE_STATE" != "running" ]; then
            echo "::error::No running EC2 instance found for deployment. Check EC2 state and update secret EC2_INSTANCE_ID."
            echo "Hint: terraform output ec2_instance_id"
            exit 1
          fi

          echo "Target EC2 instance: $INSTANCE_ID"

          ARCHIVE_B64=$(tar czf - deploy.sh docker-compose-prod.yml Caddyfile | base64 | tr -d '\n')
          PARAMS_FILE=$(mktemp)
          jq -n --arg archive "$ARCHIVE_B64" --arg image "$ECR_IMAGE" '{
            commands: [
              "set -euo pipefail",
              "mkdir -p /home/ec2-user/app",
              "echo \"" + $archive + "\" | base64 -d | tar xzf - -C /home/ec2-user/app",
              "chmod +x /home/ec2-user/app/deploy.sh",
              "bash /home/ec2-user/app/deploy.sh \"" + $image + "\""
            ]
          }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StatusDetails' \
            --output text)

          STDOUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true)

          STDERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text || true)

          echo "Deployment status: $STATUS"
          echo "----- SSM StandardOutputContent -----"
          printf '%s\n' "$STDOUT"
          echo "----- SSM StandardErrorContent -----"
          printf '%s\n' "$STDERR"
          [ "$STATUS" = "Success" ] || exit 1
