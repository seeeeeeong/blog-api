name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build -t "$ECR_REGISTRY/blog-api:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/blog-api:$IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        env:
          ECR_IMAGE: ${{ secrets.ECR_REGISTRY }}/blog-api:${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          ARCHIVE_B64=$(tar czf - deploy.sh docker-compose-prod.yml Caddyfile | base64 | tr -d '\n')
          PARAMS_FILE=$(mktemp)
          jq -n --arg archive "$ARCHIVE_B64" --arg image "$ECR_IMAGE" '{
            commands: [
              "set -euo pipefail",
              "mkdir -p /home/ec2-user/app",
              "echo \"" + $archive + "\" | base64 -d | tar xzf - -C /home/ec2-user/app",
              "chmod +x /home/ec2-user/app/deploy.sh",
              "bash /home/ec2-user/app/deploy.sh \"" + $image + "\""
            ]
          }' > "$PARAMS_FILE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$PARAMS_FILE" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StatusDetails' \
            --output text)

          STDOUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text || true)

          STDERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' \
            --output text || true)

          echo "Deployment status: $STATUS"
          echo "----- SSM StandardOutputContent -----"
          printf '%s\n' "$STDOUT"
          echo "----- SSM StandardErrorContent -----"
          printf '%s\n' "$STDERR"
          [ "$STATUS" = "Success" ] || exit 1
