services:
  app:
    image: ${ECR_IMAGE}
    container_name: blog-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_NAME=blog_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx300m -XX:MaxMetaspaceSize=150m
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-3600000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-1209600000}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
    depends_on:
      redis:
        condition: service_started
    networks:
      - blog-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s


  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - blog-network
    mem_limit: 320m

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: blog-redis-exporter
    restart: always
    command: ["--redis.addr=redis://redis:6379"]
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis
    networks:
      - blog-network
    mem_limit: 32m

  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLOUDFRONT_SECRET=${CLOUDFRONT_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - blog-network
    mem_limit: 24m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: blog-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    mem_limit: 24m

networks:
  blog-network:
    driver: bridge

volumes:
  redis-data:
  caddy-data:
  caddy-config:
