version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blog-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_db
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - blog-network

volumes:
  postgres-data:
  redis-data:

networks:
  blog-network:
    driver: bridge
