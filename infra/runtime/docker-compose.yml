services:
  blog-api:
    image: ${BLOG_API_IMAGE}
    container_name: blog-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - /opt/services/env/blog-api.env
    networks:
      - services
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  devlog-db:
    image: pgvector/pgvector:pg15
    container_name: devlog-postgres
    restart: always
    env_file:
      - /opt/services/env/devlog-db.env
    volumes:
      - /opt/services/data/devlog-postgres:/var/lib/postgresql/data
    networks:
      - services
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlog -d devlog_archive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  devlog-archive:
    image: ${DEVLOG_ARCHIVE_IMAGE}
    container_name: devlog-archive
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    env_file:
      - /opt/services/env/devlog-archive.env
    depends_on:
      devlog-db:
        condition: service_healthy
    networks:
      - services
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    restart: always
    environment:
      - CLOUDFRONT_SECRET=${CLOUDFRONT_SECRET}
    volumes:
      - /opt/services/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/services/data/caddy:/data
      - /opt/services/config/caddy:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - services
    mem_limit: 32m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: blog-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    mem_limit: 24m

networks:
  services:
    driver: bridge
