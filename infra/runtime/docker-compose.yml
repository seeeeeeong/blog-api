services:
  blog-api:
    image: ${BLOG_API_IMAGE}
    container_name: blog-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - /opt/services/env/blog-api.env
    networks:
      - services
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    restart: always
    environment:
      - CLOUDFRONT_SECRET=${CLOUDFRONT_SECRET}
      - BLOG_AI_UPSTREAM=${BLOG_AI_UPSTREAM}
    volumes:
      - /opt/services/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/services/data/caddy:/data
      - /opt/services/config/caddy:/config
    ports:
      - "80:80"
    networks:
      - services
    mem_limit: 32m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: blog-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - services
    mem_limit: 24m

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: blog-alloy
    restart: always
    environment:
      - PROMETHEUS_REMOTE_WRITE_URL=${PROMETHEUS_REMOTE_WRITE_URL}
      - PROMETHEUS_USERNAME=${PROMETHEUS_USERNAME}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    volumes:
      - /opt/services/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/services/data/alloy:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - services
    mem_limit: 128m

networks:
  services:
    driver: bridge
