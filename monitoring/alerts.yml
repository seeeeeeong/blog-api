groups:
  - name: oom_detection
    rules:
      # 시스템 가용 메모리 < 150MB → OOM Killer 발동 직전
      - alert: SystemMemoryLow
        expr: node_memory_MemAvailable_bytes < 157286400
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EC2 가용 메모리 150MB 미만"
          description: "현재 가용 메모리: {{ $value | humanize }}B — OOM Killer 발동 위험"

      # 시스템 메모리 사용률 > 90%
      - alert: SystemMemoryUsageHigh
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "시스템 메모리 사용률 90% 초과"
          description: "메모리 사용률: {{ printf \"%.1f\" (mul $value 100) }}%"

      # JVM 힙 사용률 > 85%
      - alert: JvmHeapUsageHigh
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "JVM 힙 사용률 85% 초과"
          description: "힙 사용률: {{ printf \"%.1f\" (mul $value 100) }}% (최대 256MB 기준)"

      # GC 일시정지 > 1초 (GC pressure 높음)
      - alert: JvmGcPauseHigh
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM GC 일시정지 과다"
          description: "최근 5분간 GC pause 합계: {{ printf \"%.2f\" $value }}초/초 — 메모리 압박 징후"
