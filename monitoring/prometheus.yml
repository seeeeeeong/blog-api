global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "blog-api-remote-via-ssh-tunnel"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:19090"]

  - job_name: "ec2-node-exporter"
    static_configs:
      - targets: ["host.docker.internal:19092"]
