[build]
builder = "NIXPACKS"
buildCommand = "./gradlew clean build -x test"

[deploy]
startCommand = "java -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -Dserver.port=$PORT -Dspring.profiles.active=prod -jar core/core-api/build/libs/blog-api-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
