<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Euclidean distance between two points">
  <defs>
    <style>
      .axis { stroke: #2f2f2f; stroke-width: 2; }
      .grid { stroke: #e0e0e0; stroke-width: 1; }
      .line { stroke: #1f5fbf; stroke-width: 3; }
      .point { fill: #e63b2e; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .formula { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    </style>
  </defs>

  <!-- Grid -->
  <g>
    <line class="grid" x1="80" y1="60" x2="80" y2="300" />
    <line class="grid" x1="140" y1="60" x2="140" y2="300" />
    <line class="grid" x1="200" y1="60" x2="200" y2="300" />
    <line class="grid" x1="260" y1="60" x2="260" y2="300" />
    <line class="grid" x1="320" y1="60" x2="320" y2="300" />
    <line class="grid" x1="380" y1="60" x2="380" y2="300" />
    <line class="grid" x1="440" y1="60" x2="440" y2="300" />
    <line class="grid" x1="500" y1="60" x2="500" y2="300" />
    <line class="grid" x1="560" y1="60" x2="560" y2="300" />

    <line class="grid" x1="80" y1="60" x2="560" y2="60" />
    <line class="grid" x1="80" y1="100" x2="560" y2="100" />
    <line class="grid" x1="80" y1="140" x2="560" y2="140" />
    <line class="grid" x1="80" y1="180" x2="560" y2="180" />
    <line class="grid" x1="80" y1="220" x2="560" y2="220" />
    <line class="grid" x1="80" y1="260" x2="560" y2="260" />
    <line class="grid" x1="80" y1="300" x2="560" y2="300" />
  </g>

  <!-- Axes -->
  <line class="axis" x1="80" y1="300" x2="560" y2="300" />
  <line class="axis" x1="80" y1="300" x2="80" y2="60" />

  <!-- Points -->
  <circle class="point" cx="160" cy="240" r="6" />
  <circle class="point" cx="460" cy="120" r="6" />

  <!-- Distance line -->
  <line class="line" x1="160" y1="240" x2="460" y2="120" />

  <!-- Labels -->
  <text class="label" x="145" y="260">A (x1, y1)</text>
  <text class="label" x="470" y="120">B (x2, y2)</text>
  <text class="formula" x="100" y="330">distance = sqrt((x2 - x1)^2 + (y2 - y1)^2)</text>
</svg>
